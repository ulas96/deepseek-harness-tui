[workspace]
resolver = "2"
members = ["crates/dsh-harness-client", "crates/theus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ulas96/theus-cli"
authors = ["Yusuf Ulaş Yıldız"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
